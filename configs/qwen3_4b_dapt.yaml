# =============================================================================
# DAPT Configuration for Qwen3-4B Base Model
# =============================================================================
# Domain-Adaptive Pre-Training to inject domain knowledge into the base model.
#
# DAPT Best Practices:
# - Use BASE model (not instruct) for better knowledge absorption
# - Lower learning rate (1e-5 to 5e-5) to prevent catastrophic forgetting
# - Longer warmup (10%) for stable training
# - Full precision recommended (quantization optional for memory constraints)
# - Higher LoRA rank for more capacity to learn new knowledge
#
# Usage:
#   python run_dapt.py --config configs/qwen3_4b_dapt.yaml
#   python run_dapt.py --config configs/qwen3_4b_dapt.yaml --use_quantization
# =============================================================================

model:
  # Use BASE model for DAPT (not instruct version)
  name: "Qwen/Qwen3-4B"

  # Quantization - OFF by default for best training quality
  # Enable via CLI with --use_quantization flag if GPU memory is limited
  use_quantization: false
  quantization_bits: 4
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  use_nested_quant: false

  # Full precision dtype
  torch_dtype: "bfloat16"

lora:
  # Higher rank for DAPT - more capacity to learn domain knowledge
  r: 128
  alpha: 256  # 2x rank is common
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"

data:
  train_path: "./data/corpus.jsonl"
  eval_path: null
  text_field: "text"
  max_seq_length: 2048
  pack_sequences: true  # Pack short documents for efficiency
  min_sequence_length: 64

training:
  output_dir: "./outputs/qwen3_4b_dapt_lora"

  # DAPT typically needs multiple epochs
  num_epochs: 3

  # Batch settings
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8  # Effective batch size = 32

  # DAPT uses LOWER learning rate to prevent catastrophic forgetting
  learning_rate: 5.0e-5  # Lower than fine-tuning

  # Longer warmup for stable DAPT
  warmup_ratio: 0.1  # 10% warmup

  # Regularization
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Scheduler
  lr_scheduler: "cosine"

  # Logging and checkpoints
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3

  # Precision
  fp16: false
  bf16: true

  # Memory optimization
  gradient_checkpointing: true
  optim: "adamw_torch"  # Standard AdamW for full precision

  seed: 42

logging:
  use_wandb: false
  project_name: "qwen3-dapt-lora"
  run_name: "qwen3_4b_dapt"
